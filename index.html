<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transmutación — Hero</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="css/hero.css" />
    <!--
      Estilos de esta página de prueba. No forman parte del widget:
      al pegar el hero en Elementor, usar solo css/hero.css.
    -->
    <style>
      body {
        margin: 0;
        background: #070707;
        color: #e6e6e6;
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-weight: 400;
        line-height: 1.5;
      }

      .page {
        max-width: 42rem;
        margin: 0 auto;
        padding: 4.5rem 1.5rem 6rem;
      }

      .page p {
        margin: 0 0 1.25rem;
        font-size: 1rem;
        color: #b9b9b9;
      }
    </style>
  </head>
  <body>
    <!--
      Widget HTML de Elementor
      --------------------------------------------------------------------------
      Pegar este bloque <section> en el widget HTML.
      Encolar css/hero.css y js/hero.js (type="module"), o subirlos y
      referenciarlos con URL absoluta. El script es idempotente: si Elementor
      vuelve a renderizar el widget, no crea una segunda escena.

      En WordPress, sustituir las rutas de STILLS en js/hero.js por las URLs
      absolutas de la mediateca.
    -->
    <section
      class="tm-hero"
      data-tm-hero
      aria-label="Proyección cinematográfica, Transmutación Festival de Cine Contemporáneo"
    >
      <div class="tm-hero__stage">
        <!-- El canvas WebGL se inserta aquí. Este bloque solo se muestra si WebGL no está disponible. -->
        <div class="tm-hero__fallback"></div>
        <noscript>
          <div class="tm-hero__noscript">
            <img
              src="assets/stills/01-umbral.svg"
              alt="Umbral: fachada nocturna y una sola ventana encendida"
              loading="lazy"
              decoding="async"
            />
            <img
              src="assets/stills/02-deriva.svg"
              alt="Deriva: horizonte de duna y sol bajo"
              loading="lazy"
              decoding="async"
            />
          </div>
        </noscript>
      </div>
    </section>

    <main class="page">
      <p>
        El hero queda en el flujo de la página. El desplazamiento vertical de
        esta prueba no debe quedar capturado por el componente.
      </p>
      <p>
        Debajo del widget, el resto de Elementor —textos, botones, enlaces—
        permanece operable. El lienzo no usa posición fija ni intercepta la rueda
        ni el gesto de scroll.
      </p>
    </main>

    <script type="module" src="js/hero.js"></script>
  </body>
</html>
