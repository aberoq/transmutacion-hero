/* =============================================================================
   Transmutación Hero
   Estilos del widget. Todo vive bajo #transmutacion-cinema-hero / .tc-hero.
   ============================================================================= */

/* --- Wrapper: solape hacia el intro de Elementor ---------------------------- */

#transmutacion-cinema-hero {
  --tc-bleed: clamp(64px, 12vw, 120px);
  position: relative;
  z-index: 2;
  isolation: isolate;
}

/* Atmósfera que tapa la costura intro↔hero (desktop y mobile). */
#transmutacion-cinema-hero .tc-hero__bleed {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(var(--tc-bleed) * -1);
  height: var(--tc-bleed);
  z-index: 0;
  pointer-events: none;
  background: #000;
  overflow: hidden;
}

#transmutacion-cinema-hero .tc-hero__bleed-grain {
  position: absolute;
  inset: -18%;
  opacity: 0.185;
  mix-blend-mode: soft-light;
  background-repeat: repeat;
  background-size: 180px 180px;
  pointer-events: none;
}

/* Halo de página: sigue el mouse en intro + hero (solo desktop vía JS). */
.tc-page-halo {
  position: fixed;
  left: 0;
  top: 0;
  width: 320px;
  height: 320px;
  margin: -160px 0 0 -160px;
  z-index: 3;
  pointer-events: none;
  opacity: 0;
  border-radius: 50%;
  background: radial-gradient(
    circle at 50% 50%,
    rgba(255, 248, 236, 0.55) 0%,
    rgba(255, 236, 214, 0.18) 38%,
    rgba(255, 236, 214, 0) 70%
  );
  mix-blend-mode: screen;
  will-change: transform, opacity;
  transition: opacity 220ms ease;
}

.tc-page-halo.is-on {
  opacity: 1;
}

/* --- Escenario -------------------------------------------------------------
   Desktop/iPad: 2.39:1. Teléfono (≤640px): 4:3.
   -------------------------------------------------------------------------- */

#transmutacion-cinema-hero .tc-hero {
  position: relative;
  z-index: 1;
  width: 100%;
  margin: 0;
  padding: 0;
  background: #000;
  color: #f2f2f2;
}

#transmutacion-cinema-hero .tc-hero__stage {
  position: relative;
  width: min(100%, calc(86vh * 2.39));
  max-height: 86vh;
  margin-inline: auto;
  aspect-ratio: 2.39 / 1;
  background: #000;
  overflow: hidden;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#transmutacion-cinema-hero .tc-hero.is-hot .tc-hero__stage {
  cursor: pointer;
}

/* --- Frame de proyección --------------------------------------------------- */

#transmutacion-cinema-hero .tc-hero__frame {
  position: absolute;
  inset: 0;
  will-change: transform, opacity;
  transform-origin: 50% 50%;
}

#transmutacion-cinema-hero .tc-hero__canvas {
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
  opacity: 0;
  pointer-events: none;
  transition: opacity 900ms ease;
}

#transmutacion-cinema-hero .tc-hero.is-ready .tc-hero__canvas {
  opacity: 1;
}

#transmutacion-cinema-hero .tc-hero__grain {
  position: absolute;
  inset: -18%;
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  mix-blend-mode: soft-light;
  background-repeat: repeat;
  background-size: 180px 180px;
  will-change: background-position, opacity;
}

#transmutacion-cinema-hero .tc-hero.is-ready .tc-hero__grain {
  opacity: 0.185;
}

#transmutacion-cinema-hero .tc-hero__vignette {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  opacity: 0;
  background:
    radial-gradient(
      ellipse 80% 76% at 50% 48%,
      rgba(0, 0, 0, 0) 28%,
      rgba(0, 0, 0, 0.58) 100%
    );
  transition: opacity 900ms ease;
}

#transmutacion-cinema-hero .tc-hero.is-ready .tc-hero__vignette {
  opacity: 1;
}

#transmutacion-cinema-hero .tc-hero__caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 4;
  box-sizing: border-box;
  padding: 0 4.5% 3.8%;
  pointer-events: none;
  opacity: 0;
  transform: translate3d(0, 6px, 0);
  transition: opacity 420ms ease, transform 420ms ease;
  font-family: "Poppins", sans-serif;
  text-align: left;
  max-width: 72%;
}

#transmutacion-cinema-hero .tc-hero__caption.is-visible {
  opacity: 1;
  transform: translate3d(0, 0, 0);
}

#transmutacion-cinema-hero .tc-hero__title {
  display: inline-block;
  margin: 0 0 0.35rem;
  color: #f4f4f4;
  font-size: clamp(0.95rem, 1.55vw, 1.35rem);
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  text-decoration: none;
  pointer-events: none;
}

#transmutacion-cinema-hero .tc-hero__caption.is-visible .tc-hero__title[href] {
  pointer-events: auto;
}

#transmutacion-cinema-hero .tc-hero__title:focus-visible {
  outline: 1px solid #f4f4f4;
  outline-offset: 3px;
}

#transmutacion-cinema-hero .tc-hero__meta {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 0.55rem;
  color: rgba(230, 230, 230, 0.72);
  font-size: clamp(0.68rem, 1.05vw, 0.82rem);
  font-weight: 400;
  line-height: 1.35;
  letter-spacing: 0.02em;
}

#transmutacion-cinema-hero .tc-hero__meta::before {
  content: "";
  flex: 0 0 auto;
  width: 0.55rem;
  height: 2px;
  background: #a93bd4;
}

#transmutacion-cinema-hero .tc-hero.is-fallback .tc-hero__caption {
  display: none;
}

#transmutacion-cinema-hero .tc-hero__fallback,
#transmutacion-cinema-hero .tc-hero__noscript {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 3%;
  box-sizing: border-box;
  padding: 11% 4%;
  background: #000;
  z-index: 1;
}

#transmutacion-cinema-hero .tc-hero.is-fallback .tc-hero__fallback,
#transmutacion-cinema-hero .tc-hero__noscript {
  display: flex;
}

#transmutacion-cinema-hero .tc-hero.is-fallback .tc-hero__grain,
#transmutacion-cinema-hero .tc-hero.is-fallback .tc-hero__vignette {
  display: none;
}

#transmutacion-cinema-hero .tc-hero__fallback img,
#transmutacion-cinema-hero .tc-hero__noscript img {
  display: block;
  height: 100%;
  width: auto;
  max-width: 46%;
  object-fit: cover;
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  #transmutacion-cinema-hero .tc-hero__canvas,
  #transmutacion-cinema-hero .tc-hero__vignette,
  #transmutacion-cinema-hero .tc-hero__caption {
    transition: none;
  }

  #transmutacion-cinema-hero .tc-hero__frame,
  #transmutacion-cinema-hero .tc-hero__grain {
    will-change: auto;
  }
}

@media (max-width: 640px) {
  #transmutacion-cinema-hero .tc-hero__stage {
    width: 100%;
    height: auto;
    min-height: 240px;
    max-height: 86vh;
    aspect-ratio: 4 / 3;
  }

  #transmutacion-cinema-hero .tc-hero__fallback,
  #transmutacion-cinema-hero .tc-hero__noscript {
    gap: 4%;
    padding: 12% 5%;
  }

  #transmutacion-cinema-hero .tc-hero__caption {
    max-width: 88%;
    padding: 0 5% 4.5%;
  }

  #transmutacion-cinema-hero .tc-hero__title {
    font-size: 0.88rem;
  }

  #transmutacion-cinema-hero .tc-hero__meta {
    font-size: 0.64rem;
    gap: 0.4rem;
  }
}
</style>

      <script type="module">
/* =============================================================================
   Transmutación Hero
   -----------------------------------------------------------------------------
   Carrusel infinito de stills + cámara en perspectiva con depth y parallax
   + capa de proyección (haz volumétrico, polvo, grain, vignette, flicker,
   gate weave) + foco hover/tap (escala, dim, caption, link a ficha).

   Compact (max-width 640px): sin polvo, sin parallax, DPR 1. Los 6 planos
   y sus Z se mantienen: aplanar no reduce draw calls.
   Al foco (hover/tap) el strip frena y un wash suave alumbra el still.
   En escritorio un halo CSS de página sigue el mouse en intro + hero.

   En WordPress, sustituir ASSETS.stills por URLs absolutas de la mediateca.
   Las rutas relativas se resuelven contra document.baseURI (la página).
   ============================================================================= */

// --- Assets (WordPress: pegar aquí las URLs de la Mediateca) ----------------
// El grain se genera en runtime (canvas). No hace falta un noise.webp.

const ASSETS = {
  stills: [
    "assets/stills/01-vli.webp",
    "assets/stills/02-fep.webp",
    "assets/stills/03-pndr.jpg",
    "assets/stills/04-chr.jpg",
    "assets/stills/05-kb.jpg",
    "assets/stills/06-tpos.jpg",
  ],
};

// --- Configuración ----------------------------------------------------------

const THREE_URL =
  "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

/** Tope de devicePixelRatio. 1.5 basta para el movimiento y ahorra fill-rate. */
const MAX_PIXEL_RATIO = 1.5;

/** En mobile el fill-rate duele más: 1x es suficiente para el strip. */
const MAX_PIXEL_RATIO_MOBILE = 1;

/** Mismo corte que css/hero.css. */
const COMPACT_QUERY = "(max-width: 640px)";

/** Alto del encuadre en unidades de mundo. El ancho sale de la proporción real. */
const VISIBLE_HEIGHT = 10;

/**
 * Perspectiva sutil. 28° deja leer la diferencia de Z sin deformar
 * los bordes como lo haría un gran angular.
 */
const CAMERA_FOV = 28;

/** Tope duro del parallax, en grados. El eje combinado no lo supera. */
const MAX_PARALLAX_DEG = 1;

/** Respuesta del seguimiento. Más bajo = más lento, más atmosférico. */
const PARALLAX_RESPONSE = 1.35;

/** Margen extra, en px, para empezar a cargar antes de entrar en vista. */
const PRELOAD_MARGIN = "240px 0px";

const STILLS = [
  {
    src: ASSETS.stills[0],
    alt: "Once in a full moon",
    depth: -1.2,
    title: "Once in a full moon",
    director: "Bande James Bond",
    country: "Bélgica",
    year: "2026",
    href: "https://transmutacioncine.com/peliculas/once-in-a-full-moon/",
  },
  {
    src: ASSETS.stills[1],
    alt: "Cat on my mind",
    depth: -0.35,
    title: "Cat on my mind",
    director: "Laila Pakalniņa",
    country: "Lituania",
    year: "2026",
    href: "https://transmutacioncine.com/peliculas/cat-on-my-mind/",
  },
  {
    src: ASSETS.stills[2],
    alt: "Ponderosa",
    depth: 0.08,
    title: "Ponderosa",
    director: "Rob Rice",
    country: "EE. UU.",
    year: "2026",
    href: "https://transmutacioncine.com/peliculas/ponderosa/",
  },
  {
    src: ASSETS.stills[3],
    alt: "Chronovisor",
    depth: 0.3,
    title: "Chronovisor",
    director: "Jack Auen, Kevin Walker",
    country: "EE. UU.",
    year: "2026",
    href: "https://transmutacioncine.com/peliculas/chronovisor/",
  },
  {
    src: ASSETS.stills[4],
    alt: "Kobe",
    depth: -0.15,
    title: "Kobe",
    director: "Vicente Monarque",
    country: "México",
    year: "2026",
    href: "https://transmutacioncine.com/peliculas/kobe/",
  },
  {
    src: ASSETS.stills[5],
    alt: "The price of the sun",
    depth: -0.75,
    title: "The price of the sun",
    director: "Jérôme le Maire",
    country: "Bélgica, Francia, Marruecos",
    year: "2026",
    href: "https://transmutacioncine.com/peliculas/the-price-of-the-sun/",
  },
];

const LAYOUT = {
  /** Alto del still respecto al alto visible. Deja margen negro arriba y abajo. */
  planeHeightRatio: 0.74,
  /** En teléfono (4:3), más alto = stills más grandes. */
  mobilePlaneHeightRatio: 0.92,
  /** ~2:1. Coincide con los covers cinematográficos (1024×516). */
  planeAspect: 1024 / 516,
  /** Separación entre stills, como fracción del ancho de cada plano. */
  gapRatio: 0.1,
  /**
   * Unidades de mundo por segundo.
   * Con el encuadre actual, un still tarda unos 20 s en ceder su lugar al siguiente.
   */
  speed: 0.682,
  /** Fracción de speed mientras hay foco (hover/tap). Lerp en tick. */
  focusSpeedRatio: 0.22,
};

const FOCUS = {
  /** Escala del still con foco. Sutil, no un zoom de lightbox. */
  scale: 1.045,
  /** Opacity de los stills sin foco. */
  dimOpacity: 0.62,
  /** Velocidad del lerp de escala/opacidad. */
  response: 8,
  /** Movimiento máximo (px) para contar el gesto como tap/click, no scroll. */
  tapSlopPx: 12,
};

const PROJECTION = {
  /** Opacity del haz primario / secundario (aditivo). */
  beamOpacity: 0.78,
  beamOpacitySecondaryRatio: 0.85,
  /** Opacity del frame: flicker entre estos extremos. */
  flickerMin: 0.904,
  flickerMax: 1,
  /** Velocidad del flicker (cuánto se acerca al objetivo por segundo). */
  flickerResponse: 2.4,
  /** Gate weave: traslación en px y rotación en grados. */
  weaveX: 1.94,
  weaveY: 1.6415,
  weaveRot: 0.0597,
  weaveResponse: 3.2,
  /** Overlay CSS de grain. */
  grainOpacity: 0.185,
  /** Veces por segundo que se reposiciona el grain. */
  grainHz: 8,
  /** Partículas de polvo. En compact se omiten (syncDust). */
  dustCount: 520,
  dustSize: 0.095,
  dustOpacity: 0.28,
  /** Escala de los haces de esquina mientras hay foco. */
  focusPunch: 1.6,
  /** Glow suave sobre el still con foco (sweet spot). */
  focusWashOpacity: 0.38,
  /** Halo CSS de página (desktop). */
  pageHaloOpacity: 0.9,
  pageHaloSize: 320,
};

// --- Estado compartido del arranque -----------------------------------------

const motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
const compactQuery = window.matchMedia(COMPACT_QUERY);
let reducedMotion = motionQuery.matches;
const instances = new Set();

function isCompact() {
  return compactQuery.matches;
}

function onMotionPreferenceChange(event) {
  reducedMotion = event.matches;
  instances.forEach((instance) => {
    if (reducedMotion) {
      resetParallax(instance);
      resetProjectionFx(instance);
    }
    updateFocus(instance, 0);
    syncLoop(instance);
  });
}

if (motionQuery.addEventListener) {
  motionQuery.addEventListener("change", onMotionPreferenceChange);
} else if (motionQuery.addListener) {
  motionQuery.addListener(onMotionPreferenceChange);
}

function onCompactChange() {
  instances.forEach((instance) => {
    if (instance.disposed || !instance.renderer) return;
    resize(instance);
    if (!instance.running) renderFrame(instance);
  });
}

if (compactQuery.addEventListener) {
  compactQuery.addEventListener("change", onCompactChange);
} else if (compactQuery.addListener) {
  compactQuery.addListener(onCompactChange);
}

let elementorHooked = false;

// --- Arranque ---------------------------------------------------------------

function boot() {
  const scope = document.getElementById("transmutacion-cinema-hero") || document;
  const nodes = scope.querySelectorAll("[data-tc-hero]:not([data-tc-ready])");
  nodes.forEach((root) => {
    root.setAttribute("data-tc-ready", "");
    mount(root);
  });
}

function start() {
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot, { once: true });
  } else {
    boot();
  }
}

start();

/*
  Elementor puede inyectar el widget después de DOMContentLoaded
  (editor y, a veces, el front). data-tc-ready evita una segunda escena.
*/
window.addEventListener("elementor/frontend/init", hookElementor);
hookElementor();

function hookElementor() {
  if (elementorHooked) return;
  const hooks = window.elementorFrontend && window.elementorFrontend.hooks;
  if (!hooks) return;
  elementorHooked = true;
  hooks.addAction("frontend/element_ready/html.default", boot);
}

// --- Montaje de una instancia -----------------------------------------------

function mount(root) {
  const stage = root.querySelector(".tc-hero__stage");
  const frame = root.querySelector("[data-tc-frame]") || stage;
  const fallback = root.querySelector(".tc-hero__fallback");
  const grain = root.querySelector("[data-tc-grain]");
  const caption = root.querySelector("[data-tc-caption]");
  const titleEl = root.querySelector("[data-tc-title]");
  const metaEl = root.querySelector("[data-tc-meta]");
  if (!stage || !fallback) return;

  const widget =
    document.getElementById("transmutacion-cinema-hero") || root.parentElement;
  const bleedGrain =
    (widget && widget.querySelector("[data-tc-bleed-grain]")) ||
    document.querySelector("[data-tc-bleed-grain]");

  const instance = {
    root,
    widget,
    stage,
    frame,
    fallback,
    grain,
    bleedGrain,
    caption,
    titleEl,
    metaEl,
    captionIndex: -1,
    hoverIndex: -1,
    stickyIndex: -1,
    focusIndex: -1,
    pointerInside: false,
    pointerNdc: { x: 0, y: 0 },
    pointerDown: null,
    speedScale: 1,
    fxPunch: 1,
    disposed: false,
    started: false,
    visible: false,
    pageVisible: !document.hidden,
  };

  const grainUrl = grainDataUrl();
  if (grain) {
    grain.style.backgroundImage = `url("${grainUrl}")`;
  }
  if (bleedGrain) {
    bleedGrain.style.backgroundImage = `url("${grainUrl}")`;
  }

  bindPageHalo(instance);

  const onVisibilityChange = () => {
    instance.pageVisible = !document.hidden;
    syncLoop(instance);
  };

  /*
    Dos observadores a propósito:
    - near: empieza a cargar un poco antes de entrar.
    - visible: el rAF solo corre cuando el escenario corta el viewport.
  */
  const near = new IntersectionObserver(
    (entries) => {
      if (entries[0] && entries[0].isIntersecting) {
        ensureExperience(instance);
      }
    },
    { root: null, rootMargin: PRELOAD_MARGIN, threshold: 0 }
  );

  const visibility = new IntersectionObserver(
    (entries) => {
      instance.visible = Boolean(entries[0] && entries[0].isIntersecting);
      syncLoop(instance);
    },
    { root: null, rootMargin: "0px", threshold: 0 }
  );

  near.observe(stage);
  visibility.observe(stage);
  instance.near = near;
  instance.visibility = visibility;
  instance.onVisibilityChange = onVisibilityChange;
  document.addEventListener("visibilitychange", onVisibilityChange);
  instances.add(instance);

  const rect = stage.getBoundingClientRect();
  if (
    rect.width > 2 &&
    rect.height > 2 &&
    rect.bottom > 0 &&
    rect.top < (window.innerHeight || 0)
  ) {
    ensureExperience(instance);
    instance.visible = true;
    syncLoop(instance);
  }
}

/**
 * Crea la escena la primera vez que el hero se acerca al viewport.
 * Si WebGL no existe, muestra el fallback y no vuelve a intentarlo.
 */
async function ensureExperience(instance) {
  if (instance.started || instance.disposed) return;
  instance.started = true;

  if (!hasWebGL()) {
    showFallback(instance);
    return;
  }

  let THREE;
  try {
    THREE = await import(THREE_URL);
  } catch (error) {
    showFallback(instance);
    return;
  }

  if (instance.disposed || !instance.root.isConnected) return;

  try {
    createScene(instance, THREE);
  } catch (error) {
    showFallback(instance);
  }
}

// --- Escena, cámara y renderer ----------------------------------------------

function createScene(instance, THREE) {
  const { stage, frame } = instance;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);

  const camera = new THREE.PerspectiveCamera(CAMERA_FOV, 1, 0.1, 100);
  const cameraZ = distanceForVisibleHeight(VISIBLE_HEIGHT, CAMERA_FOV);
  camera.position.set(0, 0, cameraZ);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({
    antialias: window.innerWidth >= 768,
    alpha: false,
    powerPreference: "default",
  });
  renderer.setClearColor(0x000000, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setPixelRatio(pixelRatio());
  renderer.domElement.className = "tc-hero__canvas";
  renderer.domElement.setAttribute("aria-hidden", "true");
  frame.appendChild(renderer.domElement);

  instance.THREE = THREE;
  instance.scene = scene;
  instance.camera = camera;
  instance.cameraZ = cameraZ;
  instance.renderer = renderer;
  instance.planes = [];
  instance.scroll = 0;
  instance.running = false;
  instance.rafId = 0;
  instance.lastTime = 0;
  instance.hoverActive = false;
  instance.raycaster = new THREE.Raycaster();
  instance.pointerVec = new THREE.Vector2();
  applyLayout(instance);
  resetParallax(instance);
  resetProjectionFx(instance);
  bindPointer(instance);
  buildProjection(instance);

  resize(instance);

  const resizeObserver = new ResizeObserver(() => {
    if (instance.disposed) return;
    resize(instance);
    if (!instance.running) renderFrame(instance);
  });
  resizeObserver.observe(stage);
  instance.resizeObserver = resizeObserver;

  renderer.domElement.addEventListener("webglcontextlost", (event) => {
    event.preventDefault();
    showFallback(instance);
  });

  loadStills(instance).then((textures) => {
    if (instance.disposed || !instance.root.isConnected) {
      textures.forEach((texture) => texture.dispose());
      return;
    }
    buildPlanes(instance, textures);
    layoutPlanes(instance);
    applyBeamOpacity(instance);
    applyGrainOpacity(instance);
    renderFrame(instance);
    applyProjectionFx(instance);
    instance.root.classList.add("is-ready");
    syncLoop(instance);
  });
}

/**
 * Distancia de cámara para que el plano z = 0 cubra exactamente `height`
 * unidades de alto con el FOV dado.
 */
function distanceForVisibleHeight(height, fovDeg) {
  const halfFov = (fovDeg * Math.PI) / 180 / 2;
  return height / 2 / Math.tan(halfFov);
}

function pixelRatio() {
  const dpr = window.devicePixelRatio || 1;
  const cap = isCompact() ? MAX_PIXEL_RATIO_MOBILE : MAX_PIXEL_RATIO;
  return Math.min(dpr, cap);
}

function layoutMetrics() {
  const ratio = isCompact() ? LAYOUT.mobilePlaneHeightRatio : LAYOUT.planeHeightRatio;
  const planeHeight = VISIBLE_HEIGHT * ratio;
  const planeWidth = planeHeight * LAYOUT.planeAspect;
  const slot = planeWidth * (1 + LAYOUT.gapRatio);
  return { planeHeight, planeWidth, slot };
}

function applyLayout(instance) {
  const metrics = layoutMetrics();
  const widthChanged = instance.planeWidth !== metrics.planeWidth;
  const heightChanged = instance.planeHeight !== metrics.planeHeight;
  instance.planeWidth = metrics.planeWidth;
  instance.planeHeight = metrics.planeHeight;
  instance.slot = metrics.slot;

  const { THREE } = instance;
  if (!THREE || (!widthChanged && !heightChanged && instance.geometry)) return;

  const geometry = new THREE.PlaneGeometry(metrics.planeWidth, metrics.planeHeight);
  if (instance.planes) {
    instance.planes.forEach((mesh) => {
      mesh.geometry = geometry;
    });
  }
  if (instance.geometry && instance.geometry !== geometry) {
    instance.geometry.dispose();
  }
  instance.geometry = geometry;
}

function resize(instance) {
  const { stage, camera, renderer } = instance;
  if (!renderer || !camera) return;

  const width = stage.clientWidth;
  const height = stage.clientHeight;
  if (width < 2 || height < 2) return;

  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio());
  renderer.setSize(width, height, false);
  applyLayout(instance);
  syncDust(instance);
  if (instance.planes && instance.planes.length) {
    layoutPlanes(instance);
  }
}

// --- Carga de imágenes (lazy) -----------------------------------------------

async function loadStills(instance) {
  const { THREE } = instance;
  const anisotropy = Math.min(4, instance.renderer.capabilities.getMaxAnisotropy());

  const textures = await Promise.all(
    STILLS.map((still, index) => loadStill(THREE, still, index, anisotropy))
  );

  return textures;
}

async function loadStill(THREE, still, index, anisotropy) {
  try {
    const image = await loadImage(resolveSrc(still.src));
    return textureFromImage(THREE, rasterize(image), anisotropy);
  } catch (error) {
    return createGeneratedTexture(THREE, index, anisotropy);
  }
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.decoding = "async";
    image.crossOrigin = "anonymous";
    image.onload = () => {
      if (image.decode) {
        image.decode().then(() => resolve(image)).catch(() => resolve(image));
        return;
      }
      resolve(image);
    };
    image.onerror = () => reject(new Error("No se pudo cargar " + src));
    image.src = src;
  });
}

function resolveSrc(src) {
  if (
    /^(https?:)?\/\//.test(src) ||
    src.startsWith("data:") ||
    src.startsWith("blob:") ||
    src.startsWith("/")
  ) {
    return src;
  }
  try {
    return new URL(src, document.baseURI).href;
  } catch (error) {
    return src;
  }
}

function rasterize(image) {
  const width = image.naturalWidth || image.width || 1500;
  const height = image.naturalHeight || image.height || 1000;
  if (width < 2 || height < 2) {
    throw new Error("imagen sin tamaño");
  }

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext("2d");
  context.drawImage(image, 0, 0, width, height);
  return canvas;
}

function textureFromImage(THREE, image, anisotropy) {
  const texture = new THREE.Texture(image);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.anisotropy = anisotropy;
  texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = true;
  texture.needsUpdate = true;
  return texture;
}

/**
 * Si una URL falla, el hueco no se rompe: un campo de color distinto
 * ocupa el mismo plano hasta que se sustituya el archivo.
 */
function createGeneratedTexture(THREE, index, anisotropy) {
  const palettes = [
    ["#141820", "#3a2a22", "#c9854a"],
    ["#cbb89a", "#8a623c", "#2a211c"],
    ["#12110f", "#3c342c", "#d7c3a4"],
    ["#8ea0a8", "#1d313c", "#d5ddd8"],
    ["#8d928c", "#2c312e", "#d8d2c8"],
    ["#9aa3a0", "#4d5854", "#dfe3df"],
  ];
  const [top, bottom, accent] = palettes[index % palettes.length];
  const canvas = document.createElement("canvas");
  canvas.width = 1200;
  canvas.height = 800;
  const ctx = canvas.getContext("2d");
  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, top);
  gradient.addColorStop(1, bottom);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = accent;
  ctx.fillRect(canvas.width * 0.62, canvas.height * 0.28, canvas.width * 0.08, canvas.height * 0.16);

  return textureFromImage(THREE, canvas, anisotropy);
}

// --- Planos ------------------------------------------------------------------

function buildPlanes(instance, textures) {
  const { THREE, scene, planeWidth, planeHeight } = instance;
  const geometry =
    instance.geometry || new THREE.PlaneGeometry(planeWidth, planeHeight);

  textures.forEach((texture, index) => {
    const material = new THREE.MeshBasicMaterial({
      map: texture,
      toneMapped: false,
      transparent: true,
      opacity: 1,
    });
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.z = STILLS[index].depth;
    mesh.userData.depth = STILLS[index].depth;
    mesh.userData.index = index;
    scene.add(mesh);
    instance.planes.push(mesh);
  });

  instance.geometry = geometry;
}

/**
 * Coloca los 6 planos en una tira y envuelve la coordenada X para que
 * el desplazamiento sea infinito. El salto ocurre fuera del encuadre.
 */
function layoutPlanes(instance) {
  const { planes, slot, scroll } = instance;
  const count = planes.length;
  if (!count) return;

  const strip = count * slot;

  for (let i = 0; i < count; i += 1) {
    let x = i * slot - scroll + strip / 2;
    x = ((x % strip) + strip) % strip;
    x -= strip / 2;
    planes[i].position.x = x;
    planes[i].position.z = planes[i].userData.depth;
  }
}

// --- Capa de proyección (haz + polvo en Three.js) ---------------------------

function buildProjection(instance) {
  const { THREE, scene } = instance;

  const beamTexture = new THREE.CanvasTexture(createBeamCanvas());
  beamTexture.colorSpace = THREE.SRGBColorSpace;
  beamTexture.needsUpdate = true;

  const beamMaterial = new THREE.MeshBasicMaterial({
    map: beamTexture,
    transparent: true,
    opacity: PROJECTION.beamOpacity,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    toneMapped: false,
  });

  /*
    Spill en las esquinas del encuadre: el blob vive en un rincón de la
    textura. El plano B se voltea para el rincón opuesto.
  */
  const beamGeometry = new THREE.PlaneGeometry(12, 9);
  const beamA = new THREE.Mesh(beamGeometry, beamMaterial);
  beamA.position.set(-6.1, 3.35, 2.55);
  beamA.rotation.set(-0.26, 0.58, -0.14);
  beamA.userData.baseScale = { x: 1, y: 1 };
  scene.add(beamA);

  const beamB = new THREE.Mesh(beamGeometry, beamMaterial.clone());
  beamB.material.opacity =
    PROJECTION.beamOpacity * PROJECTION.beamOpacitySecondaryRatio;
  beamB.position.set(6.2, -3.25, 1.35);
  beamB.rotation.set(0.22, -0.52, 0.12);
  beamB.scale.set(-1, -1, 1);
  beamB.userData.baseScale = { x: -1, y: -1 };
  scene.add(beamB);

  instance.beamTexture = beamTexture;
  instance.beamGeometry = beamGeometry;
  instance.beamMaterials = [beamA.material, beamB.material];
  instance.beams = [beamA, beamB];

  /*
    Wash suave sobre el still con foco (sweet spot).
    El follow del mouse vive en un halo CSS de página (bindPageHalo).
  */
  const washTexture = new THREE.CanvasTexture(createFocusWashCanvas());
  washTexture.colorSpace = THREE.SRGBColorSpace;
  washTexture.needsUpdate = true;
  const washMaterial = new THREE.MeshBasicMaterial({
    map: washTexture,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    toneMapped: false,
  });
  const wash = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), washMaterial);
  wash.visible = false;
  scene.add(wash);
  instance.focusWash = wash;
  instance.focusWashTexture = washTexture;
  instance.focusWashMaterial = washMaterial;
  instance.focusWashGeometry = wash.geometry;

  syncDust(instance);
}

function createBeamCanvas() {
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");

  const radial = ctx.createRadialGradient(
    size * 0.2,
    size * 0.18,
    size * 0.02,
    size * 0.26,
    size * 0.24,
    size * 0.5
  );
  radial.addColorStop(0, "rgba(255, 248, 236, 0.92)");
  radial.addColorStop(0.28, "rgba(255, 240, 220, 0.4)");
  radial.addColorStop(1, "rgba(255, 240, 220, 0)");
  ctx.fillStyle = radial;
  ctx.fillRect(0, 0, size, size);

  const falloff = ctx.createLinearGradient(0, 0, size, size);
  falloff.addColorStop(0, "rgba(0, 0, 0, 0)");
  falloff.addColorStop(0.55, "rgba(0, 0, 0, 0)");
  falloff.addColorStop(1, "rgba(0, 0, 0, 0.85)");
  ctx.globalCompositeOperation = "destination-out";
  ctx.fillStyle = falloff;
  ctx.fillRect(0, 0, size, size);

  return canvas;
}

function createFocusWashCanvas() {
  const size = 256;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  const radial = ctx.createRadialGradient(
    size * 0.5,
    size * 0.46,
    size * 0.04,
    size * 0.5,
    size * 0.5,
    size * 0.5
  );
  radial.addColorStop(0, "rgba(255, 248, 236, 0.7)");
  radial.addColorStop(0.4, "rgba(255, 236, 214, 0.22)");
  radial.addColorStop(1, "rgba(255, 236, 214, 0)");
  ctx.fillStyle = radial;
  ctx.fillRect(0, 0, size, size);
  return canvas;
}

function createDust(instance) {
  const { THREE } = instance;
  const count = PROJECTION.dustCount;
  const positions = new Float32Array(count * 3);
  const velocities = new Float32Array(count * 3);
  const phases = new Float32Array(count);

  for (let i = 0; i < count; i += 1) {
    seedDustParticle(positions, velocities, phases, i);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  const material = new THREE.PointsMaterial({
    map: createDustSprite(THREE),
    size: PROJECTION.dustSize,
    transparent: true,
    opacity: PROJECTION.dustOpacity,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true,
    toneMapped: false,
  });

  const points = new THREE.Points(geometry, material);
  points.frustumCulled = false;
  points.userData.velocities = velocities;
  points.userData.phases = phases;
  instance.dustGeometry = geometry;
  instance.dustMaterial = material;
  return points;
}

function seedDustParticle(positions, velocities, phases, index) {
  const i = index * 3;
  /* Volumen ancho hacia las esquinas del haz, no solo el centro. */
  const t = Math.random();
  positions[i] = (Math.random() - 0.5) * 9.5 + t * 1.6;
  positions[i + 1] = (Math.random() - 0.5) * 5.5 + 0.2 - t * 0.7;
  positions[i + 2] = 0.4 + Math.random() * 4.6;

  velocities[i] = (Math.random() - 0.5) * 0.08;
  velocities[i + 1] = 0.015 + Math.random() * 0.05;
  velocities[i + 2] = (Math.random() - 0.5) * 0.04;
  phases[index] = Math.random() * Math.PI * 2;
}

function createDustSprite(THREE) {
  const size = 64;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  const gradient = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  gradient.addColorStop(0, "rgba(255, 250, 240, 1)");
  gradient.addColorStop(0.35, "rgba(255, 245, 230, 0.45)");
  gradient.addColorStop(1, "rgba(255, 245, 230, 0)");
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);

  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.needsUpdate = true;
  return texture;
}

function updateDust(instance, dt, now) {
  const dust = instance.dust;
  if (!dust) return;

  const positions = dust.geometry.attributes.position.array;
  const velocities = dust.userData.velocities;
  const phases = dust.userData.phases;
  const count = phases.length;
  const time = now * 0.001;

  for (let i = 0; i < count; i += 1) {
    const p = i * 3;
    const sway = Math.sin(time * 0.7 + phases[i]) * 0.03;
    positions[p] += (velocities[p] + sway) * dt;
    positions[p + 1] += velocities[p + 1] * dt;
    positions[p + 2] += velocities[p + 2] * dt;

    if (
      positions[p + 1] > 4.2 ||
      positions[p] < -6.5 ||
      positions[p] > 6.5 ||
      positions[p + 2] < 0.2 ||
      positions[p + 2] > 5.4
    ) {
      seedDustParticle(positions, velocities, phases, i);
      positions[p + 1] = -3.1 + Math.random() * 0.6;
    }
  }

  dust.geometry.attributes.position.needsUpdate = true;
}

function applyBeamOpacity(instance) {
  if (!instance.beamMaterials) return;
  const punch = instance.fxPunch ?? 1;
  const primary = Math.min(1, PROJECTION.beamOpacity + (punch - 1) * 0.4);
  const secondary = primary * PROJECTION.beamOpacitySecondaryRatio;
  instance.beamMaterials[0].opacity = primary;
  if (instance.beamMaterials[1]) instance.beamMaterials[1].opacity = secondary;

  if (instance.beams) {
    instance.beams.forEach((beam) => {
      const base = beam.userData.baseScale || { x: 1, y: 1 };
      beam.scale.set(base.x * punch, base.y * punch, 1);
    });
  }
}

function applyDustOpacity(instance) {
  if (!instance.dustMaterial) return;
  instance.dustMaterial.opacity = PROJECTION.dustOpacity;
}

function applyFocusWash(instance) {
  const wash = instance.focusWash;
  if (!wash || !instance.focusWashMaterial) return;

  const punch = instance.fxPunch ?? 1;
  const focus = instance.focusIndex;
  const still = focus >= 0 && instance.planes ? instance.planes[focus] : null;
  const amount = still
    ? Math.max(
        0,
        Math.min(1, (punch - 1) / Math.max(0.01, PROJECTION.focusPunch - 1))
      )
    : 0;
  const opacity = PROJECTION.focusWashOpacity * amount;
  instance.focusWashMaterial.opacity = opacity;

  if (!still || opacity <= 0.01) {
    wash.visible = false;
    return;
  }

  wash.visible = true;
  wash.position.copy(still.position);
  wash.position.z += 0.15;
  wash.scale.set(
    instance.planeWidth * 1.12 * still.scale.x,
    instance.planeHeight * 1.18 * still.scale.y,
    1
  );
}

/**
 * Halo CSS fixed: sigue el mouse en el hero y en la sección Elementor
 * inmediata anterior (intro). Solo desktop.
 */
function bindPageHalo(instance) {
  if (instance.pageHaloBound) return;
  instance.pageHaloBound = true;

  const halo = document.createElement("div");
  halo.className = "tc-page-halo";
  halo.setAttribute("aria-hidden", "true");
  const size = PROJECTION.pageHaloSize || 320;
  halo.style.width = `${size}px`;
  halo.style.height = `${size}px`;
  halo.style.marginLeft = `${-size / 2}px`;
  halo.style.marginTop = `${-size / 2}px`;
  document.body.appendChild(halo);
  instance.pageHalo = halo;
  instance.pageHaloPos = { x: -9999, y: -9999 };
  instance.pageHaloZones = resolveHaloZones(instance);

  const onMove = (event) => {
    if (instance.disposed || reducedMotion || isCompact()) {
      setPageHaloActive(instance, false);
      return;
    }
    if (event.pointerType && event.pointerType !== "mouse") {
      setPageHaloActive(instance, false);
      return;
    }

    const x = event.clientX;
    const y = event.clientY;
    instance.pageHaloPos.x = x;
    instance.pageHaloPos.y = y;
    halo.style.transform = `translate3d(${x}px, ${y}px, 0)`;

    const active = isPointInHaloZones(x, y, instance.pageHaloZones);
    setPageHaloActive(instance, active);
  };

  const onLeave = () => setPageHaloActive(instance, false);

  const onCompact = () => {
    instance.pageHaloZones = resolveHaloZones(instance);
    if (isCompact()) setPageHaloActive(instance, false);
  };

  window.addEventListener("pointermove", onMove, { passive: true });
  window.addEventListener("blur", onLeave);
  document.addEventListener("mouseleave", onLeave);
  if (compactQuery.addEventListener) {
    compactQuery.addEventListener("change", onCompact);
  } else if (compactQuery.addListener) {
    compactQuery.addListener(onCompact);
  }

  instance.unbindPageHalo = () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("blur", onLeave);
    document.removeEventListener("mouseleave", onLeave);
    if (compactQuery.removeEventListener) {
      compactQuery.removeEventListener("change", onCompact);
    } else if (compactQuery.removeListener) {
      compactQuery.removeListener(onCompact);
    }
    setPageHaloActive(instance, false);
    halo.remove();
    instance.pageHalo = null;
    instance.pageHaloBound = false;
    instance.unbindPageHalo = null;
  };
}

function resolveHaloZones(instance) {
  const zones = [];
  const widget =
    instance.widget ||
    document.getElementById("transmutacion-cinema-hero") ||
    instance.root;
  if (widget) zones.push(widget);

  let node = widget;
  while (node && node !== document.body) {
    const isSection =
      node.classList?.contains("elementor-top-section") ||
      node.classList?.contains("elementor-section") ||
      node.getAttribute?.("data-element_type") === "section";
    if (isSection) {
      const prev = node.previousElementSibling;
      if (prev) zones.push(prev);
      break;
    }
    node = node.parentElement;
  }

  if (
    zones.length === 1 &&
    widget?.previousElementSibling &&
    !zones.includes(widget.previousElementSibling)
  ) {
    zones.push(widget.previousElementSibling);
  }

  return zones;
}

function isPointInHaloZones(x, y, zones) {
  if (!zones || !zones.length) return false;
  for (let i = 0; i < zones.length; i += 1) {
    const el = zones[i];
    if (!el || !el.getBoundingClientRect) continue;
    const r = el.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) return true;
  }
  return false;
}

function setPageHaloActive(instance, on) {
  const halo = instance.pageHalo;
  if (!halo) return;
  const active = Boolean(on);
  halo.classList.toggle("is-on", active);
  halo.style.opacity = active ? String(PROJECTION.pageHaloOpacity ?? 0.9) : "0";
}

function applyGrainOpacity(instance) {
  if (instance.grain) {
    instance.grain.style.opacity = String(PROJECTION.grainOpacity);
  }
  if (instance.bleedGrain) {
    instance.bleedGrain.style.opacity = String(PROJECTION.grainOpacity);
  }
}

function syncDust(instance) {
  if (!instance.scene || !instance.THREE) return;

  if (isCompact()) {
    disposeDust(instance);
    return;
  }

  if (instance.dust) return;
  const dust = createDust(instance);
  instance.scene.add(dust);
  instance.dust = dust;
  applyDustOpacity(instance);
}

function disposeDust(instance) {
  if (!instance.dust) return;
  instance.scene?.remove(instance.dust);
  instance.dustMaterial?.map?.dispose();
  instance.dustMaterial?.dispose();
  instance.dustGeometry?.dispose();
  instance.dust = null;
  instance.dustMaterial = null;
  instance.dustGeometry = null;
}

// --- Pointer: parallax + foco hover/tap -------------------------------------

function isTitleTarget(event) {
  return Boolean(event.target && event.target.closest && event.target.closest("[data-tc-title]"));
}

function recordPointer(instance, event) {
  const rect = instance.stage.getBoundingClientRect();
  if (rect.width < 2 || rect.height < 2) return false;

  instance.pointerInside = true;
  instance.pointerNdc = {
    x: ((event.clientX - rect.left) / rect.width) * 2 - 1,
    y: -((event.clientY - rect.top) / rect.height) * 2 + 1,
  };
  return true;
}

function bindPointer(instance) {
  const { stage } = instance;

  const onPointerMove = (event) => {
    if (instance.disposed) return;
    if (event.pointerType !== "mouse") return;
    if (!recordPointer(instance, event)) return;

    instance.hoverActive = true;

    if (!reducedMotion && !isCompact()) {
      const angles = pointerToAngles(
        Math.max(-1, Math.min(1, instance.pointerNdc.x)),
        Math.max(-1, Math.min(1, -instance.pointerNdc.y))
      );
      instance.targetYaw = angles.yaw;
      instance.targetPitch = angles.pitch;
    }

    if (!instance.running) {
      refreshHover(instance);
      updateFocus(instance, 0);
      renderFrame(instance);
    }
  };

  const onPointerDown = (event) => {
    if (instance.disposed) return;
    if (isTitleTarget(event)) return;
    if (!recordPointer(instance, event)) return;

    if (event.pointerType === "mouse") instance.hoverActive = true;

    instance.pointerDown = {
      x: event.clientX,
      y: event.clientY,
      pointerType: event.pointerType,
    };
  };

  const onPointerUp = (event) => {
    if (instance.disposed) return;

    const down = instance.pointerDown;
    instance.pointerDown = null;

    if (isTitleTarget(event)) return;
    if (!down) return;

    const moved = Math.hypot(event.clientX - down.x, event.clientY - down.y);
    if (moved > FOCUS.tapSlopPx) return;
    if (!recordPointer(instance, event)) return;

    const hit = hitStillIndex(instance);
    const isMouse = down.pointerType === "mouse" || event.pointerType === "mouse";

    if (isMouse) {
      if (hit >= 0) navigateStill(hit, event);
      return;
    }

    if (hit < 0) {
      instance.stickyIndex = -1;
      instance.hoverIndex = -1;
      setFocus(instance, -1);
      if (!instance.running) {
        updateFocus(instance, 0);
        renderFrame(instance);
      }
      return;
    }

    if (hit === instance.stickyIndex) {
      navigateStill(hit, event);
      return;
    }

    instance.stickyIndex = hit;
    setFocus(instance, hit);
    if (!instance.running) {
      updateFocus(instance, 0);
      renderFrame(instance);
    }
  };

  const onPointerLeave = () => {
    instance.pointerInside = false;
    instance.hoverActive = false;
    instance.pointerDown = null;
    instance.targetYaw = 0;
    instance.targetPitch = 0;
    instance.hoverIndex = -1;
    if (instance.stickyIndex < 0) setFocus(instance, -1);
    if (!instance.running) {
      updateFocus(instance, 0);
      renderFrame(instance);
    }
  };

  const onPointerCancel = () => {
    instance.pointerDown = null;
    instance.pointerInside = false;
    instance.hoverActive = false;
    instance.targetYaw = 0;
    instance.targetPitch = 0;
    instance.hoverIndex = -1;
  };

  stage.addEventListener("pointermove", onPointerMove, { passive: true });
  stage.addEventListener("pointerdown", onPointerDown, { passive: true });
  stage.addEventListener("pointerup", onPointerUp, { passive: true });
  stage.addEventListener("pointerleave", onPointerLeave);
  stage.addEventListener("pointercancel", onPointerCancel);

  instance.unbindParallax = () => {
    stage.removeEventListener("pointermove", onPointerMove);
    stage.removeEventListener("pointerdown", onPointerDown);
    stage.removeEventListener("pointerup", onPointerUp);
    stage.removeEventListener("pointerleave", onPointerLeave);
    stage.removeEventListener("pointercancel", onPointerCancel);
  };
}

/**
 * nx, ny en -1..1 dentro del escenario.
 * El vector resultante se recorta para que el ángulo total no pase de 1°.
 */
function pointerToAngles(nx, ny) {
  const max = (MAX_PARALLAX_DEG * Math.PI) / 180;
  let yaw = nx * max;
  let pitch = -ny * max;
  const magnitude = Math.hypot(yaw, pitch);

  if (magnitude > max) {
    const scale = max / magnitude;
    yaw *= scale;
    pitch *= scale;
  }

  return { yaw, pitch };
}

function updateParallax(instance, dt) {
  if (reducedMotion || isCompact()) {
    resetParallax(instance);
    return;
  }

  const blend = 1 - Math.exp(-PARALLAX_RESPONSE * dt);
  instance.yaw += (instance.targetYaw - instance.yaw) * blend;
  instance.pitch += (instance.targetPitch - instance.pitch) * blend;
  clampParallax(instance);
}

function resetParallax(instance) {
  instance.yaw = 0;
  instance.pitch = 0;
  instance.targetYaw = 0;
  instance.targetPitch = 0;
}

function clampParallax(instance) {
  const max = (MAX_PARALLAX_DEG * Math.PI) / 180;
  const magnitude = Math.hypot(instance.yaw, instance.pitch);
  if (magnitude <= max) return;
  const scale = max / magnitude;
  instance.yaw *= scale;
  instance.pitch *= scale;
}

/**
 * En reposo mira al origen. El parallax desplaza el punto de mira,
 * no la posición: el encuadre no se descentra, solo se inclina.
 */
function applyCamera(instance) {
  const { camera, cameraZ } = instance;
  if (!camera || cameraZ == null) return;

  const yaw = instance.yaw || 0;
  const pitch = instance.pitch || 0;
  camera.position.set(0, 0, cameraZ);
  camera.lookAt(Math.sin(yaw) * cameraZ, Math.sin(pitch) * cameraZ, 0);
}

// --- Grain / flicker / gate weave (DOM) -------------------------------------

function grainDataUrl() {
  const size = 128;
  const canvas = document.createElement("canvas");
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext("2d");
  const image = ctx.createImageData(size, size);
  const data = image.data;

  for (let i = 0; i < data.length; i += 4) {
    const value = 90 + Math.random() * 90;
    data[i] = value;
    data[i + 1] = value;
    data[i + 2] = value;
    data[i + 3] = 255;
  }

  ctx.putImageData(image, 0, 0);
  return canvas.toDataURL("image/png");
}

function resetProjectionFx(instance) {
  instance.flicker = 1;
  instance.targetFlicker = 1;
  instance.weaveX = 0;
  instance.weaveY = 0;
  instance.weaveRot = 0;
  instance.targetWeaveX = 0;
  instance.targetWeaveY = 0;
  instance.targetWeaveRot = 0;
  instance.grainClock = 0;
  applyProjectionFx(instance);
}

function updateProjectionFx(instance, dt) {
  if (reducedMotion) {
    resetProjectionFx(instance);
    return;
  }

  instance.grainClock = (instance.grainClock || 0) + dt;
  const grainInterval = 1 / PROJECTION.grainHz;
  if (instance.grain && instance.grainClock >= grainInterval) {
    instance.grainClock %= grainInterval;
    const x = Math.floor(Math.random() * 160);
    const y = Math.floor(Math.random() * 160);
    instance.grain.style.backgroundPosition = `${x}px ${y}px`;
  }

  if (Math.random() < dt * 1.8) {
    instance.targetFlicker =
      PROJECTION.flickerMin +
      Math.random() * (PROJECTION.flickerMax - PROJECTION.flickerMin);
  }

  if (Math.random() < dt * 2.2) {
    instance.targetWeaveX = (Math.random() * 2 - 1) * PROJECTION.weaveX;
    instance.targetWeaveY = (Math.random() * 2 - 1) * PROJECTION.weaveY;
    instance.targetWeaveRot = (Math.random() * 2 - 1) * PROJECTION.weaveRot;
  }

  const flickerBlend = 1 - Math.exp(-PROJECTION.flickerResponse * dt);
  const weaveBlend = 1 - Math.exp(-PROJECTION.weaveResponse * dt);
  instance.flicker += (instance.targetFlicker - instance.flicker) * flickerBlend;
  instance.weaveX += (instance.targetWeaveX - instance.weaveX) * weaveBlend;
  instance.weaveY += (instance.targetWeaveY - instance.weaveY) * weaveBlend;
  instance.weaveRot += (instance.targetWeaveRot - instance.weaveRot) * weaveBlend;

  applyProjectionFx(instance);
}

function applyProjectionFx(instance) {
  const { frame } = instance;
  if (!frame) return;

  const opacity = instance.flicker == null ? 1 : instance.flicker;
  const x = instance.weaveX || 0;
  const y = instance.weaveY || 0;
  const rot = instance.weaveRot || 0;
  frame.style.opacity = String(opacity);
  frame.style.transform = `translate3d(${x.toFixed(3)}px, ${y.toFixed(3)}px, 0) rotate(${rot.toFixed(4)}deg)`;
}

function hitStillIndex(instance) {
  const { camera, planes, raycaster, pointerVec, pointerNdc } = instance;
  if (!camera || !raycaster || !pointerVec || !planes || !planes.length) return -1;
  if (!instance.pointerInside) return -1;

  applyCamera(instance);
  pointerVec.set(pointerNdc.x, pointerNdc.y);
  raycaster.setFromCamera(pointerVec, camera);
  const hits = raycaster.intersectObjects(planes, false);
  if (!hits.length) return -1;
  const index = instance.planes.indexOf(hits[0].object);
  return index;
}

function refreshHover(instance) {
  if (instance.stickyIndex >= 0) {
    setFocus(instance, instance.stickyIndex);
    return;
  }
  const hit = hitStillIndex(instance);
  instance.hoverIndex = hit;
  setFocus(instance, hit);
}

function setFocus(instance, index) {
  const next = index == null ? -1 : index;
  instance.root.classList.toggle("is-hot", next >= 0);

  if (next === instance.focusIndex) return;
  instance.focusIndex = next;

  if (next < 0) {
    hideCaption(instance);
    return;
  }

  showCaption(instance, next);
}

function updateFocus(instance, dt) {
  if (instance.stickyIndex >= 0) {
    setFocus(instance, instance.stickyIndex);
  } else if (instance.hoverActive) {
    refreshHover(instance);
  }

  const { planes } = instance;
  if (!planes || !planes.length) return;

  const focus = instance.focusIndex;
  const snap = reducedMotion || dt <= 0;
  const blend = snap ? 1 : 1 - Math.exp(-FOCUS.response * dt);

  for (let i = 0; i < planes.length; i += 1) {
    const mesh = planes[i];
    const active = focus >= 0 && i === focus;
    const targetScale = focus < 0 ? 1 : active ? FOCUS.scale : 1;
    const targetOpacity = focus < 0 ? 1 : active ? 1 : FOCUS.dimOpacity;
    const scale = mesh.scale.x + (targetScale - mesh.scale.x) * blend;
    mesh.scale.setScalar(scale);
    mesh.material.opacity += (targetOpacity - mesh.material.opacity) * blend;
  }
}

function updateFocusMotion(instance, dt) {
  const focused = instance.focusIndex >= 0;
  const snap = reducedMotion || dt <= 0;
  const blend = snap ? 1 : 1 - Math.exp(-FOCUS.response * dt);
  const targetSpeed = focused ? LAYOUT.focusSpeedRatio : 1;
  const targetPunch = focused ? PROJECTION.focusPunch : 1;
  instance.speedScale =
    (instance.speedScale ?? 1) + (targetSpeed - (instance.speedScale ?? 1)) * blend;
  instance.fxPunch =
    (instance.fxPunch ?? 1) + (targetPunch - (instance.fxPunch ?? 1)) * blend;
  applyBeamOpacity(instance);
  applyDustOpacity(instance);
  applyFocusWash(instance);
}

function navigateStill(index, event) {
  const url = STILLS[index] && STILLS[index].href;
  if (!url) return;

  const newTab = Boolean(event.metaKey || event.ctrlKey || event.button === 1);
  if (newTab) {
    window.open(url, "_blank", "noopener");
    return;
  }

  window.location.assign(url);
}

// --- Caption / metadata de foco ---------------------------------------------

function formatMeta(still) {
  return [still.director, still.country, still.year].filter(Boolean).join(" · ");
}

function writeCaption(instance, index) {
  const still = STILLS[index];
  if (!still || !instance.titleEl || !instance.metaEl) return;

  instance.titleEl.textContent = still.title || "";
  if (still.href) {
    instance.titleEl.setAttribute("href", still.href);
  } else {
    instance.titleEl.removeAttribute("href");
  }
  instance.metaEl.textContent = formatMeta(still);
  instance.captionIndex = index;
}

function hideCaption(instance) {
  instance.caption?.classList.remove("is-visible");
  instance.captionIndex = -1;
  if (instance.titleEl) instance.titleEl.removeAttribute("href");
}

function showCaption(instance, index) {
  writeCaption(instance, index);
  instance.caption?.classList.add("is-visible");
}

// --- Bucle de animación -----------------------------------------------------

function syncLoop(instance) {
  if (instance.disposed || !instance.renderer || !instance.planes.length) return;

  const shouldRun =
    !reducedMotion && instance.visible && instance.pageVisible && instance.root.isConnected;

  if (shouldRun) {
    startLoop(instance);
    return;
  }

  stopLoop(instance);

  /* Fuera de vista no se dibuja: el rAF ya está cancelado. */
  if (reducedMotion && instance.visible && instance.root.isConnected) {
    updateFocus(instance, 0);
    renderFrame(instance);
    applyProjectionFx(instance);
  }
}

function startLoop(instance) {
  if (instance.running) return;
  instance.running = true;
  instance.lastTime = performance.now();
  instance.rafId = requestAnimationFrame((now) => tick(instance, now));
}

function stopLoop(instance) {
  instance.running = false;
  if (instance.rafId) {
    cancelAnimationFrame(instance.rafId);
    instance.rafId = 0;
  }
}

function tick(instance, now) {
  if (!instance.running) return;

  if (!instance.root.isConnected) {
    dispose(instance);
    return;
  }

  const dt = Math.min((now - instance.lastTime) / 1000, 0.05);
  instance.lastTime = now;
  updateFocus(instance, dt);
  updateFocusMotion(instance, dt);
  instance.scroll += LAYOUT.speed * (instance.speedScale ?? 1) * dt;
  layoutPlanes(instance);
  updateParallax(instance, dt);
  updateDust(instance, dt, now);
  updateProjectionFx(instance, dt);

  renderFrame(instance);
  instance.rafId = requestAnimationFrame((time) => tick(instance, time));
}

function renderFrame(instance) {
  if (!instance.renderer || !instance.scene || !instance.camera) return;
  applyCamera(instance);
  instance.renderer.render(instance.scene, instance.camera);
}

// --- Fallback y soporte WebGL -----------------------------------------------

function hasWebGL() {
  try {
    const canvas = document.createElement("canvas");
    return Boolean(canvas.getContext("webgl2") || canvas.getContext("webgl"));
  } catch (error) {
    return false;
  }
}

function showFallback(instance) {
  if (instance.disposed) return;
  stopLoop(instance);

  try {
    if (instance.fallback && !instance.fallback.childElementCount) {
      STILLS.slice(0, 2).forEach((still) => {
        const image = document.createElement("img");
        image.alt = still.alt || "";
        image.decoding = "async";
        image.loading = "lazy";
        image.src = resolveSrc(still.src);
        instance.fallback.appendChild(image);
      });
    }
  } catch (error) {
    /* Silencio: el recuadro negro del fallback basta. */
  }

  instance.root.classList.add("is-fallback");
  instance.root.classList.remove("is-ready");
  try {
    dispose(instance);
  } catch (error) {
    instance.disposed = true;
  }
}

function dispose(instance) {
  if (instance.disposed) return;
  instance.disposed = true;
  instances.delete(instance);
  stopLoop(instance);

  if (instance.near) instance.near.disconnect();
  if (instance.visibility) instance.visibility.disconnect();
  if (instance.resizeObserver) instance.resizeObserver.disconnect();
  if (instance.onVisibilityChange) {
    document.removeEventListener("visibilitychange", instance.onVisibilityChange);
  }
  if (instance.unbindParallax) instance.unbindParallax();

  if (instance.planes) {
    instance.planes.forEach((mesh) => {
      mesh.material.map?.dispose();
      mesh.material.dispose();
    });
  }
  instance.geometry?.dispose();

  if (instance.beams) {
    instance.beamMaterials?.forEach((material) => material.dispose());
    instance.beamGeometry?.dispose();
    if (instance.beamTexture && instance.beamTexture.dispose) {
      instance.beamTexture.dispose();
    }
  }

  if (instance.dust) {
    disposeDust(instance);
  }

  if (instance.focusWash) {
    instance.scene?.remove(instance.focusWash);
    instance.focusWashMaterial?.map?.dispose();
    instance.focusWashMaterial?.dispose();
    instance.focusWashGeometry?.dispose();
    instance.focusWashTexture = null;
    instance.focusWash = null;
  }

  if (instance.unbindPageHalo) instance.unbindPageHalo();

  instance.renderer?.dispose();
  instance.renderer?.domElement.remove();
}
