<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transmutación — Hero</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Poppins solo para el preview local. En Elementor el sitio ya la carga;
      no hace falta este link en el widget.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/hero.css" />
    <!--
      Estilos de esta página de prueba. No forman parte del widget:
      al pegar el hero en Elementor, usar solo css/hero.css.
    -->
    <style>
      body {
        margin: 0;
        background: #070707;
        color: #e6e6e6;
        font-family: "Poppins", sans-serif;
        font-weight: 400;
        line-height: 1.5;
      }

      .page {
        max-width: 42rem;
        margin: 0 auto;
        padding: 4.5rem 1.5rem 6rem;
      }

      .page p {
        margin: 0 0 1.25rem;
        font-size: 1rem;
        color: #b9b9b9;
      }
    </style>
  </head>
  <body>
    <!--
      Widget HTML de Elementor
      --------------------------------------------------------------------------
      Pegar este bloque <section> en el widget HTML.
      Encolar css/hero.css y js/hero.js (type="module"), o subirlos y
      referenciarlos con URL absoluta. El script es idempotente: si Elementor
      vuelve a renderizar el widget, no crea una segunda escena.

      En WordPress, sustituir las rutas de STILLS en js/hero.js por las URLs
      absolutas de la mediateca. Poppins debe estar cargada por el tema/Elementor.
    -->
    <section
      class="tm-hero"
      data-tm-hero
      aria-label="Proyección cinematográfica, Transmutación Festival de Cine Contemporáneo"
    >
      <div class="tm-hero__stage">
        <!--
          Contenedor de la proyección: recibe flicker y gate weave.
          El canvas WebGL se inserta aquí.
        -->
        <div class="tm-hero__frame" data-tm-frame>
          <div class="tm-hero__fallback"></div>
        </div>

        <!-- Capas 2D de proyección: grain + vignette. pointer-events: none. -->
        <div class="tm-hero__grain" data-tm-grain aria-hidden="true"></div>
        <div class="tm-hero__vignette" aria-hidden="true"></div>

        <!-- Metadata del still con foco (hover desktop / tap sticky). -->
        <div class="tm-hero__caption" data-tm-caption aria-live="polite">
          <a class="tm-hero__title" data-tm-title></a>
          <p class="tm-hero__meta" data-tm-meta></p>
        </div>

        <noscript>
          <div class="tm-hero__noscript">
            <img
              src="assets/stills/01-vli.webp"
              alt="Once in a full moon"
              loading="lazy"
              decoding="async"
            />
            <img
              src="assets/stills/02-fep.webp"
              alt="Cat on my mind"
              loading="lazy"
              decoding="async"
            />
          </div>
        </noscript>
      </div>
    </section>

    <script type="module" src="js/hero.js"></script>
  </body>
</html>
